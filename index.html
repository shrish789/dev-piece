<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utilities</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f6;
      --surface: #fff;
      --text: #1a1a1a;
      --muted: #555;
      --status: #666;
      --line: #ddd;
      --line-soft: #eee;
      --button-bg: #111;
      --button-text: #fff;
      --button-hover: #333;
      --error: #b00020;
      --placeholder: #999;
      --key: #0538a0;
      --str: #0b6b2a;
      --num: #8a4b08;
      --mark: #ffe08a;
      --mark-current: #f5a623;
      --added: #d8f3dc;
      --removed: #ffd6d6;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141414;
      --surface: #1c1c1c;
      --text: #ececec;
      --muted: #a3a3a3;
      --status: #a3a3a3;
      --line: #333;
      --line-soft: #2a2a2a;
      --button-bg: #ececec;
      --button-text: #111;
      --button-hover: #fff;
      --error: #ff8a80;
      --placeholder: #777;
      --key: #9ec1ff;
      --str: #8fd9a4;
      --num: #f0c27a;
      --mark: #6b5420;
      --mark-current: #a97820;
      --added: #1d3b28;
      --removed: #4a2424;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 16px; font-weight: 650; }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: inherit;
      text-decoration: none;
    }
    .brand svg { display: block; width: 22px; height: 22px; flex: none; }
    @media (prefers-reduced-motion: no-preference) {
      header { position: relative; border-bottom-color: transparent; }
      header::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: linear-gradient(90deg, #c45c6a, #c4a15c, #5a9a78, #5a78b0, #8a6aaa, #c45c6a);
        background-size: 200% 100%;
        opacity: 0.7;
        animation: hairline 28s linear infinite;
      }
      .tab, .ghost, #theme, button { transition: background 0.25s ease, color 0.25s ease; }
      .panel,
      .panel:not(.active) {
        position: absolute;
        inset: 0;
        display: flex;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.55s ease-in-out, visibility 0s linear 0.55s;
      }
      .panel.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 0.55s ease-in-out, visibility 0s linear 0s;
      }
    }
    @keyframes hairline {
      from { background-position: 0 0; }
      to { background-position: 200% 0; }
    }
    nav { display: flex; gap: 4px; }
    button {
      padding: 6px 14px;
      font: inherit;
      font-size: 14px;
      border: 0;
      border-radius: 6px;
      background: var(--button-bg);
      color: var(--button-text);
      cursor: pointer;
    }
    button:hover { background: var(--button-hover); }
    #theme {
      margin-left: auto;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .tab, .ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
    }
    .ghost { border-color: var(--line); }
    #theme:hover, .tab:hover, .ghost:hover { background: var(--line-soft); }
    .tab.active, .tab.active:hover, .ghost.active, .ghost.active:hover {
      background: var(--button-bg);
      color: var(--button-text);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface);
    }
    .toolbar input[type="search"],
    .toolbar select {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 140px;
    }
    #search-count {
      min-width: 3.5em;
      font-size: 12px;
      color: var(--muted);
    }
    #output, #diff-result, .preview {
      flex: 1;
      overflow: auto;
      padding: 8px 12px 16px;
      background: var(--surface);
    }
    #output, #diff-result {
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #output:focus { outline: none; }
    .children, .leaf { padding-left: 16px; }
    details:not([open]) > .children { display: none; }
    .when-closed { display: none; }
    details:not([open]) > summary .when-open { display: none; }
    details:not([open]) > summary .when-closed { display: inline; }
    #output[data-view="json"] .end { margin-left: -16px; }
    summary { cursor: pointer; }
    .key { color: var(--key); }
    .str { color: var(--str); }
    .num { color: var(--num); }
    mark { background: var(--mark); color: inherit; }
    mark.current { background: var(--mark-current); }
    #status, .status { font-size: 13px; color: var(--status); }
    #status.error, .status.error { color: var(--error); }
    main { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .panel:not(.active) { display: none; }
    .split { flex: 1; display: flex; min-height: 0; }
    section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }
    section + section { border-left: 1px solid var(--line); }
    label {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line-soft);
    }
    .section-head {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line-soft);
    }
    .section-head label { border-bottom: 0; }
    input[type="file"] { font: inherit; font-size: 12px; color: var(--muted); }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 0;
      margin: 0;
      padding: 12px;
      border: 0;
      resize: none;
      overflow: auto;
      outline: none;
      color: var(--text);
      caret-color: var(--text);
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--surface);
    }
    textarea::placeholder { color: var(--placeholder); }
    .diff-line { min-height: 1.45em; white-space: pre; }
    .diff-line.added { background: var(--added); }
    .diff-line.removed { background: var(--removed); }
    .preview { min-height: 0; padding: 16px 20px; line-height: 1.5; }
    .preview :first-child { margin-top: 0; }
    .preview h1 { font-size: 1.6em; line-height: 1.25; }
    .preview h2 { font-size: 1.35em; line-height: 1.25; padding-bottom: 0.2em; border-bottom: 1px solid var(--line); }
    .preview h3 { font-size: 1.15em; line-height: 1.25; }
    .preview blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
    .preview ul, .preview ol { padding-left: 1.4em; }
    .preview hr { border: 0; border-top: 1px solid var(--line); }
    .preview table { border-collapse: collapse; }
    .preview th, .preview td { border: 1px solid var(--line); padding: 4px 8px; }
    .preview img { max-width: 100%; }
    .preview input[type="checkbox"] { margin-right: 6px; }
    .preview pre { overflow: auto; padding: 8px; background: var(--bg); border-radius: 6px; }
    .preview code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .preview a { color: var(--key); }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#json">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M13 8 7 16l6 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 8l6 8-6 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 7 14 25" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <h1>Utilities</h1>
    </a>
    <nav>
      <button class="tab active" type="button" data-tool="json">JSON</button>
      <button class="tab" type="button" data-tool="sql">SQL</button>
      <button class="tab" type="button" data-tool="base64">Base64</button>
      <button class="tab" type="button" data-tool="diff">Diff</button>
      <button class="tab" type="button" data-tool="markdown">Markdown</button>
    </nav>
    <button id="theme" type="button">Dark</button>
  </header>
  <main>
    <div id="json" class="panel active">
      <div class="toolbar">
        <button id="parse" type="button">Parse</button>
        <span id="status"></span>
      </div>
      <div class="split">
        <section>
          <label for="input">Unparsed</label>
          <textarea id="input" spellcheck="false" placeholder="Paste JSON here"></textarea>
        </section>
        <section id="parsed">
          <label>Parsed</label>
          <div class="toolbar">
            <button id="view-json" class="ghost" type="button">JSON</button>
            <button id="view-tree" class="ghost" type="button">Tree</button>
            <input id="search" type="search" placeholder="Search parsed" spellcheck="false">
            <span id="search-count"></span>
            <button id="prev" class="ghost" type="button">Prev</button>
            <button id="next" class="ghost" type="button">Next</button>
            <button id="collapse" class="ghost" type="button">Collapse</button>
            <button id="expand" class="ghost" type="button">Expand</button>
          </div>
          <div id="output" tabindex="0"></div>
        </section>
      </div>
    </div>
    <div id="sql" class="panel">
      <div class="toolbar">
        <button id="format-sql" type="button">Format</button>
        <select id="sql-dialect" aria-label="SQL dialect">
          <option value="sql">Standard</option>
          <option value="postgresql">PostgreSQL</option>
          <option value="mysql">MySQL</option>
          <option value="sqlite">SQLite</option>
          <option value="bigquery">BigQuery</option>
          <option value="transactsql">T-SQL</option>
          <option value="snowflake">Snowflake</option>
        </select>
        <span id="sql-status" class="status"></span>
      </div>
      <div class="split">
        <section>
          <label for="sql-input">SQL</label>
          <textarea id="sql-input" spellcheck="false" placeholder="Paste SQL here"></textarea>
        </section>
        <section>
          <label for="sql-output">Formatted</label>
          <textarea id="sql-output" spellcheck="false" readonly placeholder="Formatted SQL appears here"></textarea>
        </section>
      </div>
    </div>
    <div id="base64" class="panel">
      <div class="toolbar">
        <button id="encode" class="ghost active" type="button">Encode</button>
        <button id="decode" class="ghost" type="button">Decode</button>
        <span id="base64-status" class="status"></span>
      </div>
      <div class="split">
        <section>
          <label id="base64-input-label" for="base64-input">Text</label>
          <textarea id="base64-input" spellcheck="false" placeholder="Paste text"></textarea>
        </section>
        <section>
          <label id="base64-output-label" for="base64-output">Base64</label>
          <textarea id="base64-output" spellcheck="false" readonly placeholder="Base64 appears here"></textarea>
        </section>
      </div>
    </div>
    <div id="diff" class="panel">
      <div class="toolbar">
        <button id="compare" type="button">Compare</button>
        <span id="diff-status" class="status"></span>
      </div>
      <div class="split">
        <section>
          <div class="section-head">
            <label for="diff-left">Left</label>
            <input id="diff-left-file" type="file" aria-label="Choose left file">
          </div>
          <textarea id="diff-left" spellcheck="false" placeholder="Paste text or choose a file"></textarea>
        </section>
        <section>
          <div class="section-head">
            <label for="diff-right">Right</label>
            <input id="diff-right-file" type="file" aria-label="Choose right file">
          </div>
          <textarea id="diff-right" spellcheck="false" placeholder="Paste text or choose a file"></textarea>
        </section>
      </div>
      <div id="diff-result"></div>
    </div>
    <div id="markdown" class="panel">
      <div class="split">
        <section>
          <label for="markdown-input">Markdown</label>
          <textarea id="markdown-input" spellcheck="false" placeholder="Write markdown"></textarea>
        </section>
        <section>
          <label>Preview</label>
          <div id="markdown-preview" class="preview"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="vendor/sql-formatter.min.js"></script>
  <script src="vendor/diff.min.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="js/json.js"></script>
  <script src="js/sql.js"></script>
  <script src="js/base64.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/markdown.js"></script>
  <script>
    const tools = ["json", "sql", "base64", "diff", "markdown"];
    const themeButton = document.getElementById("theme");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeButton.textContent = theme === "dark" ? "Light" : "Dark";
    }

    const savedTheme = localStorage.getItem("theme");
    applyTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

    themeButton.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem("theme", next);
      applyTheme(next);
    });

    function showTool(name) {
      const tool = tools.includes(name) ? name : "json";
      for (const id of tools) {
        document.getElementById(id).classList.toggle("active", id === tool);
        document.querySelector(`[data-tool="${id}"]`).classList.toggle("active", id === tool);
      }
      localStorage.setItem("tool", tool);
      if (location.hash !== "#" + tool) location.hash = tool;
    }

    document.querySelector("nav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-tool]");
      if (!button) return;
      showTool(button.dataset.tool);
    });

    window.addEventListener("hashchange", () => {
      showTool(location.hash.slice(1));
    });

    const fromHash = location.hash.slice(1);
    showTool(tools.includes(fromHash) ? fromHash : localStorage.getItem("tool"));
  </script>
</body>
</html>
